name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: HTML lint
        run: npx --yes htmlhint@1 "*.html"

      - name: Check local asset references
        run: |
          missing=0
          for f in $(grep -ohE '(href|src)="assets/[^"]+"' *.html | sed -E 's/^(href|src)="//; s/"$//' | sort -u); do
            if [ ! -f "$f" ]; then
              echo "::error::Missing asset: $f"
              missing=1
            fi
          done
          exit $missing
